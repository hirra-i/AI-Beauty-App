name: beauty_ai_app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.6.0
  cloud_functions: ^5.3.4

  # Storage
  shared_preferences: ^2.2.3

  # Image + Permissions
  image_picker: ^1.0.7
  permission_handler: ^11.3.1
  app_settings: ^5.1.1
  image: ^4.1.7

  # Networking
  http: ^1.2.1

  # UI
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.8
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/
